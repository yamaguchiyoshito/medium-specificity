<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d">
  <title id="t">絵画を「窓」として見る遠近法と、「壁」として見る平面性</title>
  <desc id="d">左は、画面の奥へ収束する線と消失点のある遠近法の絵画で、画面が窓のように奥の世界へ開いている。右は、奥行きのない平らな面に絵具の帯が並ぶ平面性の絵画で、画面が壁のように閉じている。</desc>
  <rect width="900" height="380" fill="#faf9f4"/>
  <text x="225" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#232a33" font-family="sans-serif">窓として見る絵画</text>
  <text x="225" y="66" text-anchor="middle" font-size="15" fill="#5d6873" font-family="sans-serif">遠近法：画面の奥に世界が続く</text>
  <rect x="75" y="90" width="300" height="240" fill="#fff" stroke="#232a33" stroke-width="3"/>
  <g stroke="#2b7a8c" stroke-width="2" fill="none">
    <line x1="75" y1="90" x2="225" y2="190"/>
    <line x1="375" y1="90" x2="225" y2="190"/>
    <line x1="75" y1="330" x2="225" y2="190"/>
    <line x1="375" y1="330" x2="225" y2="190"/>
    <rect x="165" y="150" width="120" height="80"/>
  </g>
  <circle cx="225" cy="190" r="6" fill="#d0693a"/>
  <text x="240" y="186" font-size="14" fill="#d0693a" font-family="sans-serif">消失点</text>
  <text x="675" y="40" text-anchor="middle" font-size="22" font-weight="700" fill="#232a33" font-family="sans-serif">壁として見る絵画</text>
  <text x="675" y="66" text-anchor="middle" font-size="15" fill="#5d6873" font-family="sans-serif">平面性：絵具と支持体が表面で一体になる</text>
  <rect x="525" y="90" width="300" height="240" fill="#fff" stroke="#232a33" stroke-width="3"/>
  <g>
    <rect x="525" y="90" width="100" height="240" fill="#2b7a8c" opacity=".35"/>
    <rect x="625" y="90" width="100" height="240" fill="#d0693a" opacity=".35"/>
    <rect x="725" y="90" width="100" height="240" fill="#5d6873" opacity=".35"/>
  </g>
  <text x="675" y="358" text-anchor="middle" font-size="14" fill="#5d6873" font-family="sans-serif">奥行きの錯視を避け、表面そのものを見せる</text>
</svg>
