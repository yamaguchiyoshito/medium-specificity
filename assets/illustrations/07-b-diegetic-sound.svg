<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 340" role="img" aria-labelledby="t d">
  <title id="t">物語世界の内の音と外の音</title>
  <desc id="d">大きな円が物語世界を表す。円の内側に登場人物と、登場人物にも聞こえるディエジェティック・サウンド（会話や環境音）を置き、円の外側に観客と、観客だけに聞こえるノンディエジェティック・サウンド（BGMなど）を置く。</desc>
  <rect width="900" height="340" fill="#faf9f4"/>
  <circle cx="300" cy="170" r="140" fill="#fff" stroke="#232a33" stroke-width="2.5"/>
  <text x="300" y="52" text-anchor="middle" font-size="16" fill="#5d6873" font-family="sans-serif">物語世界</text>
  <circle cx="240" cy="190" r="18" fill="#2b7a8c"/><text x="240" y="228" text-anchor="middle" font-size="14" fill="#232a33" font-family="sans-serif">登場人物</text>
  <text x="345" y="140" font-size="26" fill="#2b7a8c" font-family="sans-serif">♪</text>
  <text x="300" y="112" text-anchor="middle" font-size="15" font-weight="700" fill="#2b7a8c" font-family="sans-serif">ディエジェティック</text>
  <text x="300" y="268" text-anchor="middle" font-size="14" fill="#232a33" font-family="sans-serif">登場人物にも聞こえる</text>
  <circle cx="720" cy="170" r="22" fill="#d0693a"/><text x="720" y="214" text-anchor="middle" font-size="14" fill="#232a33" font-family="sans-serif">観客</text>
  <text x="600" y="110" font-size="26" fill="#d0693a" font-family="sans-serif">♪</text>
  <text x="640" y="80" text-anchor="middle" font-size="15" font-weight="700" fill="#d0693a" font-family="sans-serif">ノンディエジェティック</text>
  <text x="640" y="268" text-anchor="middle" font-size="14" fill="#232a33" font-family="sans-serif">観客にだけ聞こえる（BGMなど）</text>
  <path d="M600 120 C640 140 670 150 695 165" fill="none" stroke="#d0693a" stroke-width="2" stroke-dasharray="5 4"/>
</svg>
