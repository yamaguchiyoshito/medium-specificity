<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 360" role="img" aria-labelledby="t d">
  <title id="t">旋律・和声・リズムの三要素</title>
  <desc id="d">横軸を時間、縦軸を音の高さとした格子に音符を点で置いた図。点を横につないだ線が旋律、同じ時刻に縦に重なる点が和声、点の間隔の取り方がリズムを表す。</desc>
  <rect width="900" height="360" fill="#faf9f4"/>
  <rect x="80" y="30" width="740" height="250" fill="#fff" stroke="#dedad0" stroke-width="2"/>
  <g stroke="#dedad0" stroke-width="1.5">
    <line x1="80" y1="80" x2="820" y2="80"/><line x1="80" y1="130" x2="820" y2="130"/><line x1="80" y1="180" x2="820" y2="180"/><line x1="80" y1="230" x2="820" y2="230"/>
  </g>
  <polyline points="150,200 290,150 400,110 590,170 720,120" fill="none" stroke="#2b7a8c" stroke-width="3"/>
  <g fill="#2b7a8c"><circle cx="150" cy="200" r="9"/><circle cx="290" cy="150" r="9"/><circle cx="400" cy="110" r="9"/><circle cx="590" cy="170" r="9"/><circle cx="720" cy="120" r="9"/></g>
  <g fill="#d0693a"><circle cx="590" cy="230" r="9"/><circle cx="590" cy="120" r="9"/><circle cx="400" cy="210" r="9"/></g>
  <line x1="590" y1="110" x2="590" y2="240" stroke="#d0693a" stroke-width="2.5" stroke-dasharray="5 4"/>
  <line x1="400" y1="100" x2="400" y2="220" stroke="#d0693a" stroke-width="2.5" stroke-dasharray="5 4"/>
  <text x="150" y="258" text-anchor="middle" font-size="14" fill="#2b7a8c" font-family="sans-serif">旋律（横）</text>
  <text x="665" y="236" font-size="14" fill="#d0693a" font-family="sans-serif">和声（縦）</text>
  <g stroke="#5d6873" stroke-width="2"><line x1="150" y1="300" x2="290" y2="300"/><line x1="290" y1="300" x2="400" y2="300"/><line x1="400" y1="300" x2="590" y2="300"/><line x1="590" y1="300" x2="720" y2="300"/>
  <line x1="150" y1="292" x2="150" y2="308"/><line x1="290" y1="292" x2="290" y2="308"/><line x1="400" y1="292" x2="400" y2="308"/><line x1="590" y1="292" x2="590" y2="308"/><line x1="720" y1="292" x2="720" y2="308"/></g>
  <text x="450" y="336" text-anchor="middle" font-size="14" fill="#5d6873" font-family="sans-serif">リズム（点の間隔：規則とずれの組み合わせ）</text>
  <text x="70" y="160" text-anchor="end" font-size="14" fill="#5d6873" font-family="sans-serif">高さ</text>
</svg>
