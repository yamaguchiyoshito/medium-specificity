<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 380" role="img" aria-labelledby="t d">
  <title id="t">写真と絵画：像ができるまでの因果の違い</title>
  <desc id="d">上段の写真では、光が被写体で反射し、レンズを通って感光面に届き像になる。下段の絵画では、画家が被写体を見て、意図に基づいて手で描き、像になる。写真は光の物理的な痕跡であり、絵画は画家の意図による構成である。</desc>
  <defs><marker id="ah" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="8" markerHeight="8" orient="auto"><path d="M0 0L10 5L0 10z" fill="#5d6873"/></marker></defs>
  <rect width="900" height="380" fill="#faf9f4"/>
  <text x="40" y="45" font-size="20" font-weight="700" fill="#2b7a8c" font-family="sans-serif">写真</text>
  <g fill="#fff" stroke="#232a33" stroke-width="2"><rect x="40" y="65" width="150" height="70" rx="8"/><rect x="270" y="65" width="150" height="70" rx="8"/><rect x="500" y="65" width="150" height="70" rx="8"/><rect x="730" y="65" width="130" height="70" rx="8"/></g>
  <g font-family="sans-serif" font-size="16" fill="#232a33" text-anchor="middle"><text x="115" y="106">被写体</text><text x="345" y="106">レンズ</text><text x="575" y="106">感光面</text><text x="795" y="106">像</text></g>
  <g stroke="#5d6873" stroke-width="2.5" marker-end="url(#ah)"><line x1="192" y1="100" x2="266" y2="100"/><line x1="422" y1="100" x2="496" y2="100"/><line x1="652" y1="100" x2="726" y2="100"/></g>
  <text x="229" y="88" text-anchor="middle" font-size="13" fill="#2b7a8c" font-family="sans-serif">反射光</text>
  <text x="450" y="165" text-anchor="middle" font-size="15" fill="#5d6873" font-family="sans-serif">光の物理的な痕跡（因果的な接続）</text>
  <line x1="40" y1="195" x2="860" y2="195" stroke="#dedad0" stroke-width="2"/>
  <text x="40" y="235" font-size="20" font-weight="700" fill="#d0693a" font-family="sans-serif">絵画</text>
  <g fill="#fff" stroke="#232a33" stroke-width="2"><rect x="40" y="255" width="150" height="70" rx="8"/><rect x="270" y="255" width="150" height="70" rx="8"/><rect x="500" y="255" width="150" height="70" rx="8"/><rect x="730" y="255" width="130" height="70" rx="8"/></g>
  <g font-family="sans-serif" font-size="16" fill="#232a33" text-anchor="middle"><text x="115" y="296">被写体</text><text x="345" y="296">画家の意図</text><text x="575" y="296">手による描画</text><text x="795" y="296">像</text></g>
  <g stroke="#5d6873" stroke-width="2.5" marker-end="url(#ah)"><line x1="192" y1="290" x2="266" y2="290"/><line x1="422" y1="290" x2="496" y2="290"/><line x1="652" y1="290" x2="726" y2="290"/></g>
  <text x="450" y="355" text-anchor="middle" font-size="15" fill="#5d6873" font-family="sans-serif">画家の判断が像を構成する</text>
</svg>
